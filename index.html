<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AJ Gaming — Welcome</title>
  <meta name="description" content="AJ Gaming — A curated collection of browser-based mini-games. Play Tic Tac Toe, Money Heist, and Haunted House Escape." />
  <link rel="stylesheet" href="styles.css" />

  <!-- Firebase Auth SDK (compat build for simple usage) -->
  <!-- TODO: If you don't need auth, you can safely remove these two script tags -->
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.1/firebase-auth-compat.js"></script>

  <style>
    /* ── Page-specific styles ───────────────────────────────── */
    .login-bg {
      position: fixed;
      inset: 0;
      background:
        url('bg2.jpg') center / cover no-repeat,
        var(--color-bg-deep);
      z-index: -2;
    }

    .login-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(3, 3, 8, 0.65);
      z-index: -1;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: var(--space-10);
      position: relative;
      z-index: 1;
    }

    .login-logo {
      font-family: var(--font-display);
      font-size: var(--text-3xl);
      font-weight: 900;
      text-align: center;
      margin-bottom: var(--space-2);
      letter-spacing: 2px;
    }

    .login-logo span {
      color: var(--color-primary);
    }

    .login-tagline {
      text-align: center;
      color: var(--color-text-muted);
      font-size: var(--text-sm);
      margin-bottom: var(--space-8);
    }

    .login-divider {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      margin: var(--space-6) 0;
      color: var(--color-text-muted);
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    /* ── Floating ambient orbs ──────────────────────────────── */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: -1;
      opacity: 0.4;
    }

    .ambient-orb--1 {
      width: 300px; height: 300px;
      background: var(--color-primary);
      top: 10%; left: 15%;
      animation: float 8s ease-in-out infinite;
    }

    .ambient-orb--2 {
      width: 200px; height: 200px;
      background: var(--color-purple);
      bottom: 20%; right: 10%;
      animation: float 6s ease-in-out infinite reverse;
    }
  </style>
</head>

<body class="page-wrapper bg-dot-grid">
  <!-- Ambient background -->
  <div class="login-bg" aria-hidden="true"></div>
  <div class="ambient-orb ambient-orb--1" aria-hidden="true"></div>
  <div class="ambient-orb ambient-orb--2" aria-hidden="true"></div>

  <!-- Main Content -->
  <main class="page-main page-main--center">

    <!-- Login Card -->
    <div class="login-card glass-panel animate-fade-in-scale" id="login-card">
      <div class="login-logo">🎮 <span>AJ</span> Gaming</div>
      <p class="login-tagline">Enter your world of games</p>

      <form id="login-form" class="form-group" autocomplete="off">
        <input
          type="email"
          id="login-email"
          class="form-input"
          placeholder="Email address"
          required
          autocomplete="email"
        />
        <input
          type="password"
          id="login-password"
          class="form-input"
          placeholder="Password"
          required
          autocomplete="current-password"
        />
        <button type="submit" id="login-submit" class="btn btn--primary btn--lg">
          Enter Game
        </button>
      </form>

      <div class="login-divider">or</div>

      <!-- Quick play (skip login for development / when Firebase isn't configured) -->
      <a href="games.html" id="quick-play-btn" class="btn btn--ghost btn--lg" style="width:100%;">
        Play as Guest →
      </a>

      <p style="margin-top: var(--space-6); text-align: center; font-size: var(--text-sm); color: var(--color-text-muted);">
        Don't have an account?
        <a href="#" id="show-register" style="color: var(--color-primary); font-weight: 600;">Create one</a>
      </p>
    </div>

  </main>

  <!-- Register Modal -->
  <div class="modal-overlay" id="register-modal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="register-title">
      <div class="modal-title" id="register-title">Create Account</div>
      <form id="register-form" class="form-group" style="text-align:left; margin-bottom: var(--space-6);">
        <input type="text"     id="reg-username" class="form-input" placeholder="Username" required />
        <input type="email"    id="reg-email"    class="form-input" placeholder="Email address" required autocomplete="email" />
        <input type="password" id="reg-password" class="form-input" placeholder="Password (6+ characters)" required minlength="6" autocomplete="new-password" />
        <button type="submit" class="btn btn--success btn--lg" style="width:100%;">Sign Up</button>
      </form>
      <button class="btn btn--ghost btn--sm" id="close-register" type="button">← Back to Login</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer">
    © 2025 AJ Gaming — Made with ❤️ by <a href="#">Aditya</a>
  </footer>

  <!-- Shared Utilities -->
  <script src="shared.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

      /* ── Elements ─────────────────────────────────────────── */
      const loginForm      = document.getElementById('login-form');
      const loginEmail     = document.getElementById('login-email');
      const loginPassword  = document.getElementById('login-password');
      const showRegister   = document.getElementById('show-register');
      const closeRegister  = document.getElementById('close-register');
      const registerModal  = document.getElementById('register-modal');
      const registerForm   = document.getElementById('register-form');
      const regEmail       = document.getElementById('reg-email');
      const regPassword    = document.getElementById('reg-password');

      /* ── Register Modal Toggle ────────────────────────────── */
      function openRegisterModal() {
        registerModal.classList.add('is-open');
        document.getElementById('reg-username').focus();
      }

      function closeRegisterModal() {
        registerModal.classList.remove('is-open');
        showRegister.focus();
      }

      showRegister.addEventListener('click', (e) => {
        e.preventDefault();
        openRegisterModal();
      });

      closeRegister.addEventListener('click', closeRegisterModal);

      registerModal.addEventListener('click', (e) => {
        if (e.target === registerModal) closeRegisterModal();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && registerModal.classList.contains('is-open')) {
          closeRegisterModal();
        }
      });

      /* ── Login Handler ────────────────────────────────────── */
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email    = loginEmail.value.trim();
        const password = loginPassword.value;

        if (!email || !password) {
          AJ.Toast.show('⚠️ Please fill in all fields');
          return;
        }

        // If Firebase is configured, attempt real auth
        if (AJ.Auth.isConfigured()) {
          try {
            await AJ.Auth.login(email, password);
            AJ.Toast.show('✅ Login successful!');
            AJ.Sound.play('success');
            setTimeout(() => window.location.href = 'games.html', 800);
          } catch (err) {
            AJ.Toast.show('❌ ' + err.message, 3500);
            AJ.Sound.play('error');
          }
        } else {
          // Dev mode: just let them in with a toast
          AJ.Toast.show('🎮 Welcome! (Auth not configured — entering as guest)');
          AJ.Sound.play('success');
          setTimeout(() => window.location.href = 'games.html', 1000);
        }
      });

      /* ── Register Handler ─────────────────────────────────── */
      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email    = regEmail.value.trim();
        const password = regPassword.value;

        if (!email || !password) {
          AJ.Toast.show('⚠️ Please fill in all fields');
          return;
        }

        if (AJ.Auth.isConfigured()) {
          try {
            await AJ.Auth.register(email, password);
            AJ.Toast.show('✅ Account created! You can now log in.');
            AJ.Sound.play('success');
            registerForm.reset();
            setTimeout(closeRegisterModal, 1200);
          } catch (err) {
            AJ.Toast.show('❌ ' + err.message, 3500);
            AJ.Sound.play('error');
          }
        } else {
          AJ.Toast.show('⚙️ Firebase not configured. Add your API keys to shared.js');
          AJ.Sound.play('error');
        }
      });

    });
  </script>
</body>
</html>
