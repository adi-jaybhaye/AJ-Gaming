<body class="min-h-screen bg-black flex flex-col text-white relative">

  <!-- Main Content (flex-grow pushes footer to bottom) -->
  <main class="flex-grow flex items-center justify-center relative">

    <!-- Login Form -->
    <div class="z-20 bg-black bg-opacity-70 p-8 rounded-2xl shadow-2xl w-80">
      <h2 class="text-2xl font-bold mb-6 text-center text-cyan-400">Welcome To AJ's Gaming World</h2>
      <form class="flex flex-col space-y-4" >
  <input type="text" placeholder="Username"
         class="input-glow w-full px-4 py-2 bg-transparent border border-cyan-400 rounded focus:outline-none" />

  <input type="password" placeholder="Password"
         class="input-glow w-full px-4 py-2 bg-transparent border border-cyan-400 rounded focus:outline-none" />

  <a href="games.html"  type="submit"  
          class="btn-glow w-full bg-cyan-400 text-black font-bold py-2 rounded hover:bg-cyan-300 transition duration-300 text-center">
    Enter Game
      </a>      
</form>

      <p class="mt-4 text-center text-sm text-gray-400">
        Don’t have an account?
        <a href="#" id="register-btn" class="text-cyan-400 hover:underline">Register</a>
      </p>
    </div>

    <!-- ✅ Register Panel -->
    <div id="register-panel"
         class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-60 opacity-0 scale-95 pointer-events-none transition-opacity transition-transform duration-500 ease-out">
      <div
        class="relative bg-gray-800 p-8 rounded-2xl shadow-2xl w-80 transform scale-95 transition-transform duration-500 ease-out">
        
        <!-- Magician sprite -->
        <div class="mx-auto mb-4 w-24 h-24 magician-sprite"></div>

        <!-- Register Form -->
        <form id="register-form" class="flex flex-col space-y-4">
          <h2 class="text-2xl text-white font-bold text-center">Create Account</h2>
          <input type="text" placeholder="Username" required
                 class="px-4 py-2 rounded-md bg-gray-700 text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400" />
          <input type="email" placeholder="Email" required
                 class="px-4 py-2 rounded-md bg-gray-700 text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400" />
          <input type="password" placeholder="Password" required
                 class="px-4 py-2 rounded-md bg-gray-700 text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-400" />
          <button type="submit"
                  class="px-4 py-2 bg-green-500 hover:bg-green-600 text-white font-bold rounded-md transform hover:scale-105 transition">
            Sign Up
          </button>
        </form>
      </div>
    </div>

  </main>

  <!-- 🔻 Footer at the Bottom -->
  <footer class="fixed bottom-0 left-0 w-full h-20  backdrop-blur-sm shadow-md py-3 text-center flex items-center justify-center text-white">
    © 2025 | with ❤️ by ADITYA
  </footer>
</body>


  <script>
  // ─── Grab elements AFTER DOM is loaded ─────────────────────────────
  window.addEventListener('DOMContentLoaded', () => {
    const showBtn = document.getElementById('register-btn');
    const registerPan = document.getElementById('register-panel');

    // ─── Toggle function ─────────────────────────────────────────────
    function toggleRegisterPanel() {
      registerPan.classList.toggle('opacity-0');
      registerPan.classList.toggle('opacity-100');
      registerPan.classList.toggle('scale-95');
      registerPan.classList.toggle('scale-100');
      registerPan.classList.toggle('pointer-events-none');
      registerPan.classList.toggle('pointer-events-auto');
    }

    // ─── Event listeners ─────────────────────────────────────────────
    showBtn.addEventListener('click', e => {
      e.preventDefault();
      toggleRegisterPanel();
    });

    registerPan.addEventListener('click', e => {
      if (e.target === registerPan) {
        toggleRegisterPanel();
      }
    });
  });

  document.addEventListener("DOMContentLoaded", () => {
    // Firebase setup
    const auth = firebase.auth();

    // Login
    document.getElementById("login-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          alert("✅ Login successful!");
          // 🚀 Redirect to games.html
         window.location.href ="games.html";
        })
        .catch((error) => {
          alert("❌ Login error: " + error.message);
        });
    });

    // Register
    document.getElementById("register-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("reg-username").value;
      const password = document.getElementById("reg-password").value;

      auth.createUserWithEmailAndPassword(email, password)
        .then(() => {
          alert("✅ Registration successful!");
          document.getElementById("register-form").reset();
          // Optional: Close the panel or switch back to login
        })
        .catch((error) => {
          alert("❌ Registration error: " + error.message);
        });
    });
  });
</script>
