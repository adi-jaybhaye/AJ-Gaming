<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neon Rings Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      overflow: hidden;
      margin: 0;
      height: 100vh;
      position: relative;
      background: linear-gradient(to top, #87cefa 0%, #f0f8ff 100%);
    }

    /* ==== CLOUDS ==== */
    .cartoon-cloud {
      position: absolute;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: cloudMove 60s linear infinite;
    }

    .cloud1 { width: 120px; height: 60px; top: 20%; left: -150px; animation-delay: 0s; }
    .cloud2 { width: 200px; height: 80px; top: 40%; left: -250px; animation-delay: 10s; }
    .cloud3 { width: 160px; height: 70px; top: 60%; left: -180px; animation-delay: 20s; }

    @keyframes cloudMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(150vw); }
    }

    /* ==== SUNRISE ==== */
    .sun {
      position: absolute;
      bottom: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 160px;
      background: radial-gradient(circle at center, #FFD700, #FFA500);
      border-radius: 50%;
      animation: riseSun 10s ease-out forwards;
      z-index: 1;
      opacity: 0.9;
    }

    @keyframes riseSun {
      0% { bottom: -100px; opacity: 0; }
      50% { opacity: 0.5; }
      100% { bottom: 20%; opacity: 1; }
    }

    /* ==== BIRDS ==== */
    .bird {
      position: absolute;
      top: 10%;
      left: -100px;
      width: 60px;
      height: 60px;
      background: url('https://cdn-icons-png.flaticon.com/512/616/616408.png') no-repeat center/contain;
      animation: birdFly 25s linear infinite;
      z-index: 2;
      opacity: 0.8;
    }

    .bird:nth-child(4) { top: 15%; animation-delay: 0s; }
    .bird:nth-child(5) { top: 25%; animation-delay: 5s; }
    .bird:nth-child(6) { top: 35%; animation-delay: 10s; }

    @keyframes birdFly {
      0% { transform: translateX(0); }
      100% { transform: translateX(120vw); }
    }

    /* ==== NEON RINGS ==== */
    .neon-ring {
      --dist: 200px;
      --dur: 12s;
      position: absolute;
      top: 50%;
      left: 50%;
      width: 260px;
      height: 260px;
      margin: -130px 0 0 -130px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--c1), var(--c2), var(--c3));
      opacity: 0.9;
      transform-origin: center center;
      animation: orbit var(--dur) linear infinite;
      will-change: transform;
    }

    @keyframes orbit {
      to {
        transform: rotate(360deg) translateX(var(--dist)) rotate(-360deg);
      }
    }

    .neon-ring:nth-child(7) { --c1:#f00; --c2:#0f0; --c3:#00f; --dist:180px; --dur:11s; }
    .neon-ring:nth-child(8) { --c1:#ff0; --c2:#0ff; --c3:#f0f; --dist:220px; --dur:14s; }
    .neon-ring:nth-child(9) { --c1:#0f0; --c2:#00f; --c3:#f00; --dist:200px; --dur:13s; }

    /* ==== CLICKABLE SHAPES ==== */
    .click-dot, .click-square {
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ff0080;
      cursor: pointer;
      animation: float 3.5s ease-in-out infinite;
      z-index: 3;
    }

    .click-square {
      border-radius: 4px;
      background: #00ff90;
      animation-delay: 0.5s;
    }

    .click-dot:nth-of-type(10) { top: 25%; left: 35%; animation-delay: 0s; }
    .click-dot:nth-of-type(11) { top: 45%; left: 25%; animation-delay: 1s; }
    .click-dot:nth-of-type(12) { top: 30%; left: 60%; animation-delay: 2s; }
    .click-square:nth-of-type(13) { top: 60%; left: 40%; animation-delay: 1.2s; }
    .click-square:nth-of-type(14) { top: 20%; left: 70%; animation-delay: 2.2s; }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-12px) scale(1.1); }
    }

    .clicked {
      animation: clickPop 0.5s forwards;
    }

    @keyframes clickPop {
      to {
        transform: scale(2) rotate(45deg);
        opacity: 0;
      }
    }

    /* ==== FORM ==== */
    .btn-glow:hover {
      box-shadow: 0 0 10px #00fff7, 0 0 40px #00fff7;
    }

    .input-glow:focus {
      box-shadow: 0 0 5px #00fff7;
      border-color: #00fff7;
    }
  </style>
</head>
<body class="flex items-center justify-center h-screen relative">

  <!-- CLOUDS -->
  <div class="cartoon-cloud cloud1"></div>
  <div class="cartoon-cloud cloud2"></div>
  <div class="cartoon-cloud cloud3"></div>

  <!-- SUNRISE -->
  <div class="sun"></div>

  <!-- BIRDS -->
  <div class="bird"></div>
  <div class="bird"></div>
  <div class="bird"></div>

  <!-- NEON RINGS -->
  <div class="neon-ring"></div>
  <div class="neon-ring"></div>
  <div class="neon-ring"></div>

  <!-- CLICKABLE FLOATING SHAPES -->
  <div class="click-dot"></div>
  <div class="click-dot"></div>
  <div class="click-dot"></div>
  <div class="click-square"></div>
  <div class="click-square"></div>

  <!-- LOGIN FORM -->
  <div class="z-20 bg-black bg-opacity-70 p-8 rounded-2xl shadow-2xl text-white w-80 relative">
    <h2 class="text-2xl font-bold mb-6 text-center text-cyan-400">Login to Arena</h2>
    <form>
      <input type="text" placeholder="Username"
             class="input-glow w-full px-4 py-2 mb-4 bg-transparent border border-cyan-400 rounded focus:outline-none"/>
      <input type="password" placeholder="Password"
             class="input-glow w-full px-4 py-2 mb-6 bg-transparent border border-cyan-400 rounded focus:outline-none"/>
      <button type="submit"
              class="btn-glow w-full bg-cyan-400 text-black font-bold py-2 rounded hover:bg-cyan-300 transition duration-300">
        Enter Game
      </button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-400">
      Don’t have an account? <a href="#" class="text-cyan-400 hover:underline">Register</a>
    </p>
  </div>

  <script>
    document.querySelectorAll('.click-dot, .click-square').forEach(el => {
      el.addEventListener('click', () => {
        el.classList.add('clicked');
        setTimeout(() => el.classList.remove('clicked'), 500);
      });
    });
  </script>
</body>
</html>
